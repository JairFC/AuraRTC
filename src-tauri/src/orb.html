<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuraRTC Orb</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent !important;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-app-region: drag; /* Arrastrable */
      user-select: none;
    }

    #orbCanvas {
      width: 100%;
      height: 100%;
      /* Bloquear pointer events por defecto para evitar bugs de drag, 
         pero como queremos scroll, lo dejamos activo. */
    }
  </style>
</head>
<body>
  
  <canvas id="orbCanvas"></canvas>

  <script type="module">
    console.log("[Orb] Initializing Pro Max V2 (Atomic Canvas)...");

    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    
    // Resize Handle (Tauri Command)
    let currentSize = 175; // Sincronizado con el tamaño en lib.rs
    
    let invoke = null;
    let listen = null;

    try {
        if (window.__TAURI__) {
            invoke = window.__TAURI__.core.invoke;
            listen = window.__TAURI__.event.listen;
        } else {
            console.warn("[Orb] Tauri API not injected globally.");
        }
    } catch(e) {
        console.error("[Orb] Tauri injection error", e);
    }

    // Window Resize Handling
    window.addEventListener('resize', resizeCanvas);
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    // Ctrl + Mouse Wheel to Resize Window
    window.addEventListener('wheel', (e) => {
        if (invoke && e.ctrlKey) {
            e.preventDefault();
            if (e.deltaY < 0) currentSize += 10;
            else currentSize -= 10;
            
            // Limites: min 50px, max 400px
            if (currentSize < 50) currentSize = 50;
            if (currentSize > 400) currentSize = 400;

            console.log("[Orb] Resizing window to:", currentSize);
            if (invoke) {
                invoke('resizeorb', { size: currentSize }).catch(e => console.error("Resize error", e));
            }
        }
    }, { passive: false });

    // ==========================================
    // ESTADOS
    // ==========================================
    window.isRemoteSpeaking = false;
    window.isUserSpeaking = false;
    window.isDisconnected = false;
    
    // Eliminado el setupMic() local. Ahora Rust inyecta directamente
    // // These globals are set by the injector via IPC events.
    // Listens for IPC events from the injector running inside the target site.


    // SISTEMA DE PARTÍCULAS MEJORADO
    // ==========================================
    const particles = [];
    for(let i=0; i<60; i++) {
        particles.push({
            angle: Math.random() * Math.PI * 2,
            radius: Math.random() * 40 + 20,
            speed: Math.random() * 0.02 + 0.01,
            size: Math.random() * 3 + 1,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: Math.random() * 0.05 + 0.02,
            color: 'rgba(150, 200, 255, 0.3)'
        });
    }

    // Funciones de interpolación
    function lerp(start, end, amt) {
        return (1 - amt) * start + amt * end;
    }
    
    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : {r: 0, g: 0, b: 0};
    }

    let corePulse = 0;
    
    // Variables de estado suavizado
    let currentR1 = 0, currentG1 = 240, currentB1 = 255;
    let currentR2 = 0, currentG2 = 90,  currentB2 = 158;
    let currentScale = 1;
    let currentSpeedMult = 1;

    function render() {
        requestAnimationFrame(render);
        
        // Limpiar canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        // El "padding invisible": engañamos al sistema de renderizado
        // diciéndole que la pantalla es un 35% más pequeña de lo que realmente es.
        // Esto asegura que la animación nunca toque los bordes reales del canvas.
        const minDim = Math.min(canvas.width, canvas.height) * 0.65;
        const baseCoreSize = minDim * 0.15;

        // Modificadores
        const userSpeaking = window.isUserSpeaking;
        const remoteSpeaking = window.isRemoteSpeaking;
        
        // Determinar colores objetivo
        let targetR1, targetG1, targetB1;
        let targetR2, targetG2, targetB2;
        let targetScale = 1;
        let pColor = 'rgba(150, 200, 255, 0.3)';

        if (window.isDisconnected) {
            // ROJO (Desconectado)
            targetR1 = 255; targetG1 = 77; targetB1 = 77;
            targetR2 = 138; targetG2 = 0; targetB2 = 0;
            targetScale = 0.8;
            pColor = 'rgba(255, 100, 100, 0.5)';
        } else if (remoteSpeaking && userSpeaking) {
            // DORADO/ORO (Interrupción - Ambos Hablando)
            targetR1 = 255; targetG1 = 215; targetB1 = 0;
            targetR2 = 180; targetG2 = 100; targetB2 = 0;
            targetScale = 1.4 + Math.sin(Date.now() / 50) * 0.15; // Vibración máxima
            pColor = 'rgba(255, 215, 0, 0.8)';
        } else if (remoteSpeaking) {
            // PÚRPURA (Remote Speaking)
            targetR1 = 255; targetG1 = 0; targetB1 = 255;
            targetR2 = 110; targetG2 = 0; targetB2 = 138;
            targetScale = 1.3 + Math.sin(Date.now() / 100) * 0.1; // Pulso rápido
            pColor = 'rgba(255, 100, 255, 0.6)';
        } else if (userSpeaking) {
            // AZUL/CYAN BRILLANTE (Usuario Hablando)
            targetR1 = 0; targetG1 = 255; targetB1 = 255;
            targetR2 = 0; targetG2 = 100; targetB2 = 255;
            targetScale = 1.2 + Math.sin(Date.now() / 150) * 0.05; // Expansión
            pColor = 'rgba(100, 255, 255, 0.8)';
        } else {
            // VERDE NEUTRAL (Silencio)
            targetR1 = 0; targetG1 = 200; targetB1 = 100;
            targetR2 = 0; targetG2 = 90; targetB2 = 50;
            targetScale = 1.0;
            pColor = 'rgba(100, 255, 150, 0.3)';
        }

        // Interpolar colores suavemente (Lerp)
        const lerpSpeed = 0.04; // Más suave
        currentR1 = lerp(currentR1, targetR1, lerpSpeed);
        currentG1 = lerp(currentG1, targetG1, lerpSpeed);
        currentB1 = lerp(currentB1, targetB1, lerpSpeed);
        currentR2 = lerp(currentR2, targetR2, lerpSpeed);
        currentG2 = lerp(currentG2, targetG2, lerpSpeed);
        currentB2 = lerp(currentB2, targetB2, lerpSpeed);
        currentScale = lerp(currentScale, targetScale, lerpSpeed * 1.5);
        
        let targetSpeedMult = remoteSpeaking && userSpeaking ? 4 : (remoteSpeaking ? 3 : (userSpeaking ? 2 : 1));
        currentSpeedMult = lerp(currentSpeedMult, targetSpeedMult, 0.05);

        corePulse += 0.05;
        const breathe = Math.sin(corePulse) * 2;
        const coreSize = baseCoreSize * currentScale;

        const color1 = `rgb(${Math.round(currentR1)}, ${Math.round(currentG1)}, ${Math.round(currentB1)})`;
        const color2 = `rgb(${Math.round(currentR2)}, ${Math.round(currentG2)}, ${Math.round(currentB2)})`;

        // --- Dibujar Aura (Corregido el corte rectangular) ---
        // El radio máximo del gradiente ahora es exactamente la mitad de minDim,
        // lo que asegura que termine en opacidad 0 justo antes de tocar el borde de la ventana.
        const maxRadius = (minDim / 2) * 0.95; 
        
        const auraGrad = ctx.createRadialGradient(cx, cy, coreSize * 0.5, cx, cy, maxRadius);
        auraGrad.addColorStop(0, `rgba(${Math.round(currentR1)}, ${Math.round(currentG1)}, ${Math.round(currentB1)}, 0.6)`);
        auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = auraGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- Dibujar Partículas ---
        const scaleFactor = minDim / 100;
        particles.forEach(p => {
            // Mover partículas suavemente
            p.angle += p.speed * currentSpeedMult;
            p.wobble += p.wobbleSpeed * currentSpeedMult;
            
            let currentRadius = p.radius * scaleFactor * 0.8;
            if (userSpeaking) currentRadius += 10 * scaleFactor;
            if (window.isRemoteSpeaking) currentRadius += Math.sin(p.wobble) * 10 * scaleFactor;
            if (userSpeaking && window.isRemoteSpeaking) currentRadius += Math.random() * 5 * scaleFactor; // Tensión

            const px = cx + Math.cos(p.angle) * currentRadius + Math.cos(p.wobble) * 5;
            const py = cy + Math.sin(p.angle) * currentRadius + Math.sin(p.wobble) * 5;

            ctx.beginPath();
            ctx.arc(px, py, p.size * (window.isRemoteSpeaking ? 1.5 : 1), 0, Math.PI * 2);
            ctx.fillStyle = pColor;
            ctx.fill();
        });

        // --- Dibujar Núcleo ---
        ctx.beginPath();
        ctx.arc(cx, cy, coreSize + breathe*0.5, 0, Math.PI * 2);
        const coreGrad = ctx.createRadialGradient(cx-coreSize*0.3, cy-coreSize*0.3, 0, cx, cy, coreSize);
        coreGrad.addColorStop(0, '#ffffff');
        coreGrad.addColorStop(0.2, color1);
        coreGrad.addColorStop(1, color2);
        ctx.fillStyle = coreGrad;
        ctx.shadowBlur = window.isRemoteSpeaking ? 30 : 20;
        ctx.shadowColor = color1;
        ctx.fill();
    }

    render();
  </script>
</body>
</html>
